[project]
name = "papertrail-agent-demo"
version = "0.1.0"
description = "Standalone MCP agent layer for PaperTrail export bundles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "openai>=1.0",
    "pypdf>=5",
]

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
papertrail-agent-demo = "papertrail_agent_demo.cli:main"
papertrail-agent-mcp = "papertrail_agent_demo.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
